name: Build and Pack

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./NT.Blazor.ErrorBoundary.slnx

      - name: Build
        run: dotnet build ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-build --no-restore

      - name: Test release tooling
        run: npm test

      - name: Collect code coverage
        run: |
          dotnet test --project ./Tests/NT.Blazor.ErrorBoundary.Tests/NT.Blazor.ErrorBoundary.Tests.csproj --framework net10.0 --configuration Release --no-build --no-restore --results-directory ./artifacts/coverage/core --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test --project ./Tests/NT.Blazor.ErrorBoundary.AspNetCore.Tests/NT.Blazor.ErrorBoundary.AspNetCore.Tests.csproj --framework net10.0 --configuration Release --no-build --no-restore --results-directory ./artifacts/coverage/aspnetcore --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: ./artifacts/coverage/**/*.xml
          if-no-files-found: error

      - name: Pack
        run: |
          set -euo pipefail
          dotnet pack ./NT.Blazor.ErrorBoundary/NT.Blazor.ErrorBoundary.csproj --configuration Release --no-build --no-restore --output ./artifacts/packages
          dotnet pack ./NT.Blazor.ErrorBoundary.AspNetCore/NT.Blazor.ErrorBoundary.AspNetCore.csproj --configuration Release --no-build --no-restore --output ./artifacts/packages
          core_package=$(find ./artifacts/packages -maxdepth 1 -type f -name 'NT.Blazor.ErrorBoundary.*.nupkg' ! -name 'NT.Blazor.ErrorBoundary.AspNetCore.*' ! -name '*.snupkg' -print -quit)
          test -n "$core_package"
          unzip -p "$core_package" staticwebassets/nt-blazor-error-boundary.js > /dev/null

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.*nupkg
          if-no-files-found: error
