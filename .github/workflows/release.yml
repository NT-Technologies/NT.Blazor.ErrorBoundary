name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # Fails the run before anything is tagged when the trusted publishing policy or NUGET_USER is missing.
  # Only this job and publish can request an OIDC token, and neither runs npm or repository code.
  nuget-login-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write

    steps:
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

  release:
    needs: nuget-login-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Restore
        run: dotnet restore ./NT.Blazor.ErrorBoundary.slnx

      - name: Build
        run: dotnet build ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh ./Tests/NT.Blazor.ErrorBoundary.EndToEnd.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Test
        env:
          NT_E2E_REQUIRED: true
        run: dotnet test --solution ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-build --no-restore

      - name: Check for existing stable release tag
        id: check-tags
        run: |
          git fetch --tags
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install semantic-release
        if: steps.check-tags.outputs.is_tagged == 'false'
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Create stable GitHub release
        if: steps.check-tags.outputs.is_tagged == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags
          npx --no-install semantic-release

      - name: Resolve stable package version
        id: release-version
        run: |
          set -euo pipefail
          git fetch --tags
          release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$release_tag" ]; then
            echo "No stable release tag found on this commit."
            exit 1
          fi
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/nuget
          dotnet pack ./NT.Blazor.ErrorBoundary/NT.Blazor.ErrorBoundary.csproj --configuration Release --no-build --no-restore --output ./artifacts/nuget -p:PackageVersion=${{ steps.release-version.outputs.version }}
          dotnet pack ./NT.Blazor.ErrorBoundary.AspNetCore/NT.Blazor.ErrorBoundary.AspNetCore.csproj --configuration Release --no-build --no-restore --output ./artifacts/nuget -p:PackageVersion=${{ steps.release-version.outputs.version }}
          dotnet pack ./NT.Blazor.ErrorBoundary.AzureMonitor/NT.Blazor.ErrorBoundary.AzureMonitor.csproj --configuration Release --no-build --no-restore --output ./artifacts/nuget -p:PackageVersion=${{ steps.release-version.outputs.version }}
          unzip -p "./artifacts/nuget/NT.Blazor.ErrorBoundary.${{ steps.release-version.outputs.version }}.nupkg" staticwebassets/nt-blazor-error-boundary.js > /dev/null

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*.*nupkg
          if-no-files-found: error

  # Re-running this job alone republishes the same packages and unlists again; both steps are safe to repeat.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/nuget

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Unlist older prerelease packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          release_version="${{ needs.release.outputs.version }}"
          python3 - "$release_version" <<'PY' > prerelease-versions-to-unlist.txt
          import json
          import sys
          import urllib.error
          import urllib.request

          release = tuple(int(part) for part in sys.argv[1].split("."))
          packages = ("NT.Blazor.ErrorBoundary", "NT.Blazor.ErrorBoundary.AspNetCore", "NT.Blazor.ErrorBoundary.AzureMonitor")

          def prerelease_is_lower(version):
              version_without_build = version.split("+", 1)[0]
              if "-" not in version_without_build:
                  return False
              core = version_without_build.split("-", 1)[0]
              try:
                  core_parts = tuple(int(part) for part in core.split("."))
              except ValueError:
                  return False
              return core_parts <= release

          for package in packages:
              url = f"https://api.nuget.org/v3-flatcontainer/{package.lower()}/index.json"
              # A package's first release has no published versions yet.
              try:
                  with urllib.request.urlopen(url) as response:
                      versions = json.load(response)["versions"]
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise
              for version in versions:
                  if prerelease_is_lower(version):
                      print(f"{package} {version}")
          PY
          if [ ! -s prerelease-versions-to-unlist.txt ]; then
            echo "No prerelease packages older than $release_version were found."
            exit 0
          fi
          while read -r package version; do
            echo "Unlisting $package $version"
            dotnet nuget delete "$package" "$version" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --non-interactive
          done < prerelease-versions-to-unlist.txt
