name: Publish Prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Runs one at a time so two quick pushes cannot race the forced preview branch push and semantic-release.
concurrency:
  group: publish-prerelease
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./NT.Blazor.ErrorBoundary.slnx

      - name: Build
        run: dotnet build ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh ./Tests/NT.Blazor.ErrorBoundary.EndToEnd.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Test
        env:
          NT_E2E_REQUIRED: true
        run: dotnet test --solution ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-build --no-restore

  # Fails the run before anything is tagged when the trusted publishing policy or NUGET_USER is missing.
  # Only this job and publish can request an OIDC token, and neither runs npm or repository code.
  nuget-login-check:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write

    steps:
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

  release:
    needs: nuget-login-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check for existing preview release tag
        id: check-tags
        run: |
          git fetch --tags
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$'; then
            echo "is_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Restore
        run: dotnet restore ./NT.Blazor.ErrorBoundary.slnx

      - name: Build
        run: dotnet build ./NT.Blazor.ErrorBoundary.slnx --configuration Release --no-restore

      - name: Install semantic-release
        if: steps.check-tags.outputs.is_tagged == 'false'
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Create preview GitHub release
        if: steps.check-tags.outputs.is_tagged == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview HEAD
          git push --force origin HEAD:preview
          GITHUB_REF=refs/heads/preview GITHUB_REF_NAME=preview npx --no-install semantic-release

      - name: Resolve preview package version
        id: release-version
        run: |
          set -euo pipefail
          git fetch --tags
          release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$release_tag" ]; then
            echo "No preview release was created for this commit; skipping package publication."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        if: steps.release-version.outputs.version != ''
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/nuget
          dotnet pack ./NT.Blazor.ErrorBoundary/NT.Blazor.ErrorBoundary.csproj --configuration Release --no-build --no-restore --output ./artifacts/nuget -p:PackageVersion=${{ steps.release-version.outputs.version }}
          dotnet pack ./NT.Blazor.ErrorBoundary.AspNetCore/NT.Blazor.ErrorBoundary.AspNetCore.csproj --configuration Release --no-build --no-restore --output ./artifacts/nuget -p:PackageVersion=${{ steps.release-version.outputs.version }}
          dotnet pack ./NT.Blazor.ErrorBoundary.AzureMonitor/NT.Blazor.ErrorBoundary.AzureMonitor.csproj --configuration Release --no-build --no-restore --output ./artifacts/nuget -p:PackageVersion=${{ steps.release-version.outputs.version }}
          unzip -p "./artifacts/nuget/NT.Blazor.ErrorBoundary.${{ steps.release-version.outputs.version }}.nupkg" staticwebassets/nt-blazor-error-boundary.js > /dev/null

      - name: Upload NuGet packages
        if: steps.release-version.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/nuget/*.*nupkg
          if-no-files-found: error

  # Re-running this job alone republishes the same packages; --skip-duplicate makes that safe.
  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/nuget

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
